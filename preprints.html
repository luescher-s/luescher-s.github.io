<style>

body {
    font-family: 'Roboto', Arial, sans-serif;
    background: url('background.jpg') no-repeat center top fixed;
    background-size: cover;
    margin: 0;
    min-height: 100vh;
    color: #222;
}

.container {
    background: #fff;
    max-width: 700px;
    margin: 64px auto 40px;
    box-shadow: 0 8px 32px rgba(90,141,238,.13);
    border-radius: 18px;
    padding: 32px;
    border: 2px solid #000;
}

h1 {
    font-size: 1.8em;
    text-align: center;
    margin: 0 0 1rem 0;
    color: #000;
}

.list {
    margin-top: 8px;
}

.entry {
    display: flex;
    gap: 12px;
    align-items: flex-start;
    padding: 12px 0;
    border-bottom: 1px solid #eee;
}

.entry:last-child {
    border-bottom: none;
}

.badge {
    flex: 0 0 auto;
    font-size: .78em;
    background: #e7f0ff;
    border: 1px solid #cfe0ff;
    border-radius: 12px;
    padding: 3px 8px;
    margin-top: 2px;
}

.content {
    flex: 1 1 auto;
    min-width: 0;
}

.title {
    font-size: 1.02em;
    margin: 0 0 .25em 0;
    color: #000;
}

.meta,
.legal {
    font-size: .9em;
    color: #444;
    margin: .15em 0;
}

.links {
    font-size: .9em;
    margin-top: .2em;
}

a {
    color: #5a8dee;
    text-decoration: none;
}

a:hover {
    text-decoration: underline;
}

</style>

<body>

<div class="container">

<h1>Preprints</h1>

<!-- Static container for preprint list -->

<div id="preprint-list" class="list"></div>

</div>

<script>

const PREPRINTS = [

{
    title: "Seat Reversals and Candidate Status Changes under Biproportional Representation",
    year: 2026,
    type: "Preprint",
    venue: "Research Square",
    date: "10 August 2026",
    doi: "10.21203/rs.3.rs-10500080/v1",
    pdf: "https://luescher-s.github.io/preprints/Seat-Reversals-and-Candidate-Status-Changes_Luescher_2026.pdf",
    legal: "Licensed under the Creative Commons Attribution 4.0 International License (CC BY 4.0)."
},

{
    title: "Parlamentswahlen nach dem doppelt-proportionalen Sitzzuteilungsverfahren im Lichte der territorialen Repräsentation",
    year: 2023,
    type: "Preprint",
    journal: "Zeitschrift für Parlamentsfragen (ZParl)",
    volume: "54",
    issue: "3",
    pages: "571–595",
    doi: "10.5771/0340-1758-2023-3-571",
    pdf: "https://luescher-s.github.io/preprints/zparl-2023-preprint.pdf",
    legal: "Made available according to § 38(4) UrhG and the Nomos self-archiving policy."
},

{
    title: "Proportionality in two dimensions: resolving an old dilemma of political (mis)representation",
    year: 2021,
    type: "Preprint",
    venue: "SVPW Congress",
    date: "4 February 2021",
    doi: "",
    pdf: "https://luescher-s.github.io/preprints/Proportionality-in-Two-Dimensions_Luescher_20210129.pdf"
}

];

const root = document.getElementById("preprint-list");

PREPRINTS
    .sort((a, b) => (b.year || 0) - (a.year || 0))
    .forEach(p => {

        const wrap = document.createElement("div");
        wrap.className = "entry";

        const badge = document.createElement("span");
        badge.className = "badge";
        badge.textContent = p.type || "Preprint";

        const content = document.createElement("div");
        content.className = "content";

        const h = document.createElement("h2");
        h.className = "title";
        h.textContent = p.title;

        content.appendChild(h);

        const meta1 = document.createElement("p");
        meta1.className = "meta";

        if (p.journal) {

            let publication = `Published in: <em>${p.journal}</em>`;

            if (p.volume) {
                publication += `, ${p.volume}`;
            }

            if (p.issue) {
                publication += `(${p.issue})`;
            }

            if (p.year) {
                publication += `, ${p.year}`;
            }

            if (p.pages) {
                publication += `, pp. ${p.pages}`;
            }

            publication += ".";

            meta1.innerHTML = publication;

        } else if (p.venue) {

            let publication = `<em>${p.venue}</em>`;

            if (p.date) {
                publication += `, ${p.date}`;
            } else if (p.year) {
                publication += `, ${p.year}`;
            }

            publication += ".";

            meta1.innerHTML = publication;

        } else {

            meta1.textContent = p.year ? String(p.year) : "";

        }

        content.appendChild(meta1);

        if (p.doi) {
            const meta2 = document.createElement("p");
            meta2.className = "meta";
            meta2.innerHTML =
                `DOI: <a href="https://doi.org/${p.doi}" target="_blank" rel="noopener noreferrer">${p.doi}</a>`;
            content.appendChild(meta2);
        }

        if (p.pdf) {
            const links = document.createElement("p");
            links.className = "links";
            links.innerHTML =
                `<strong>PDF:</strong> <a href="${p.pdf}" target="_blank" rel="noopener noreferrer">Download</a>`;
            content.appendChild(links);
        }

        if (p.legal) {
            const legal = document.createElement("p");
            legal.className = "legal";
            legal.textContent = p.legal;
            content.appendChild(legal);
        }

        wrap.appendChild(badge);
        wrap.appendChild(content);
        root.appendChild(wrap);

    });

</script>

</body>
</html>
